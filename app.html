<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#075e54">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<title>কল চ্যাট — অ্যাপ</title>
<style>
:root{--g:#075e54;--g2:#25d366;--bg:#0b141a;--card:#1f2c34;--tx:#e9edef;--mut:#8696a0;--red:#e53935}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,-apple-system,"Noto Sans Bengali",sans-serif;background:var(--bg);color:var(--tx);height:100dvh;overflow:hidden}
.screen{display:none;height:100dvh;flex-direction:column}
.screen.on{display:flex}
button{font:inherit;cursor:pointer;border:0;color:inherit}
input{font:inherit;color:inherit}
/* লগইন */
#login{align-items:center;justify-content:center;padding:24px;text-align:center;gap:14px}
#login .logo{width:84px;height:84px;border-radius:50%;background:var(--g2);display:grid;place-items:center;font-size:42px}
#login input{width:100%;max-width:320px;padding:14px;border-radius:12px;border:1px solid #2a3942;background:var(--card);text-align:center;font-size:18px}
.btn{background:var(--g2);color:#04210f;font-weight:700;padding:13px 28px;border-radius:24px;font-size:16px}
#err{color:#ff8a80;min-height:20px;font-size:14px}
/* হোম */
header{background:var(--g);padding:14px 16px;display:flex;align-items:center;justify-content:space-between}
header h1{font-size:19px}
header small{opacity:.8}
#users{flex:1;overflow:auto;padding:6px 0}
.user{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid #16232b}
.av{width:46px;height:46px;border-radius:50%;background:#3b4a54;display:grid;place-items:center;font-size:19px;font-weight:700;flex:none;text-transform:uppercase}
.user .nm{flex:1;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.user .nm small{display:block;color:var(--g2);font-size:12px}
.ib{width:42px;height:42px;border-radius:50%;background:var(--card);font-size:19px}
.empty{color:var(--mut);text-align:center;padding:48px 24px;line-height:1.7}
/* কল */
#call{position:fixed;inset:0;background:#0b141a;z-index:10}
#remote{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
#local{position:absolute;right:12px;top:calc(12px + env(safe-area-inset-top));width:96px;height:136px;object-fit:cover;border-radius:12px;background:#222;border:2px solid #fff3;z-index:2;transform:scaleX(-1)}
#info{position:relative;z-index:2;text-align:center;padding-top:calc(48px + env(safe-area-inset-top));text-shadow:0 1px 6px #000a}
#info .av{width:110px;height:110px;font-size:46px;margin:0 auto 14px}
#info h2{font-size:24px}
#info p{margin-top:6px;color:#cfd8dc}
.ctrls{position:absolute;bottom:calc(28px + env(safe-area-inset-bottom));left:0;right:0;display:flex;justify-content:center;gap:16px;z-index:3}
.cb{width:58px;height:58px;border-radius:50%;background:#ffffff26;backdrop-filter:blur(8px);font-size:24px}
.cb.off{background:#fff;color:#000}
.cb.end{background:var(--red)}
.cb.acc{background:var(--g2)}
#chat{position:absolute;left:0;right:0;bottom:110px;max-height:46%;display:none;flex-direction:column;z-index:3;background:#0b141aee;border-radius:16px 16px 0 0}
#chat.on{display:flex}
#msgs{overflow:auto;padding:10px;display:flex;flex-direction:column;gap:6px}
.m{max-width:78%;padding:7px 11px;border-radius:12px;background:var(--card);font-size:15px;word-break:break-word}
.m.me{align-self:flex-end;background:#005c4b}
#cf{display:flex;gap:8px;padding:8px}
#cf input{flex:1;padding:10px 14px;border-radius:20px;border:0;background:var(--card)}
#cf button{background:var(--g2);color:#04210f;border-radius:20px;padding:0 16px;font-weight:700}
/* ইনকামিং */
#incoming{position:fixed;inset:0;background:linear-gradient(#0b3a33,#0b141a);z-index:20;display:none;flex-direction:column;align-items:center;justify-content:space-between;padding:calc(90px + env(safe-area-inset-top)) 0 calc(60px + env(safe-area-inset-bottom));text-align:center}
#incoming.on{display:flex}
#incoming .av{width:120px;height:120px;font-size:50px;margin:0 auto 16px}
.row{display:flex;gap:70px}
</style>
</head>
<body>

<section id="login" class="screen on">
  <div class="logo">📞</div>
  <h1>কল চ্যাট</h1>
  <p style="color:var(--mut)">একটি নাম দিন, তারপর অন্য কাউকে কল করুন</p>
  <input id="name" maxlength="24" placeholder="আপনার নাম" autocomplete="off">
  <div id="err"></div>
  <button class="btn" onclick="login()">শুরু করুন</button>
  <a href="/" style="color:var(--mut);font-size:14px">← হোম পেজ</a>
</section>

<section id="home" class="screen">
  <header><div><h1>কল চ্যাট</h1><small id="me"></small></div><small id="st">● অনলাইন</small></header>
  <div id="users"></div>
</section>

<section id="call" class="screen">
  <video id="remote" autoplay playsinline></video>
  <video id="local" autoplay playsinline muted></video>
  <div id="info"><div class="av" id="cav"></div><h2 id="cname"></h2><p id="cstat"></p></div>
  <div id="chat"><div id="msgs"></div>
    <form id="cf" onsubmit="sendChat(event)"><input id="ci" placeholder="মেসেজ লিখুন…" autocomplete="off"><button>পাঠান</button></form></div>
  <div class="ctrls">
    <button class="cb" id="bMute" aria-label="মাইক চালু/বন্ধ" onclick="toggleMic()">🎤</button>
    <button class="cb" id="bCam" aria-label="ক্যামেরা চালু/বন্ধ" onclick="toggleCam()">📷</button>
    <button class="cb" id="bFlip" aria-label="ক্যামেরা বদল" onclick="flipCam()">🔄</button>
    <button class="cb" aria-label="চ্যাট" onclick="toggleChat()">💬</button>
    <button class="cb end" aria-label="কল শেষ করুন" onclick="endCall()">📵</button>
  </div>
</section>

<div id="incoming">
  <div><div class="av" id="iav"></div><h2 id="iname" style="font-size:26px"></h2><p id="itype" style="color:#cfd8dc;margin-top:6px"></p></div>
  <div class="row">
    <button class="cb end" style="width:70px;height:70px" aria-label="প্রত্যাখ্যান" onclick="rejectCall()">📵</button>
    <button class="cb acc" style="width:70px;height:70px" aria-label="কল ধরুন" onclick="acceptCall()">📞</button>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);

let ICE = {
  iceServers: [{ urls: ['stun:stun.l.google.com:19302', 'stun:stun1.l.google.com:19302'] }],
  iceCandidatePoolSize: 8,
  bundlePolicy: 'max-bundle',
  rtcpMuxPolicy: 'require'
};
fetch('/config').then(r => r.json()).then(c => {
  if (c && c.iceServers) ICE = { ...ICE, ...c, iceCandidatePoolSize: 8 };
}).catch(() => {});

let me = null, es = null, pc = null, dc = null, localStream = null;
let peer = null, incoming = null, pendingIce = [], withVideo = false, timer = null, startedAt = 0;
let onlineUsers = [], remoteStream = null, token = null, wakeLock = null;
let offerReady = false, outIce = [], iceFlushTimer = null, sigQueue = Promise.resolve();
let ringTimeout = null, discTimer = null, iceRestartTimer = null, retryTimer = null;
let facing = 'user', wantOnline = false, mediaPromise = null;

function show(id){ document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id)); }
const initial = n => (n || '?').trim().charAt(0);

/* ---------- সংযোগ ---------- */
function login(){
  const n = $('#name').value.trim();
  if (!n) return;
  $('#err').textContent = '';
  initAudio();
  try { localStorage.setItem('callname', n); } catch {}
  connect(n);
}
$('#name').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
try { const s = localStorage.getItem('callname'); if (s) $('#name').value = s; } catch {}

function connect(name, isRetry){
  clearTimeout(retryTimer);
  if (es) es.close();
  wantOnline = true;
  es = new EventSource('/events?user=' + encodeURIComponent(name));
  let ok = false;
  es.addEventListener('hello', e => {
    ok = true; me = name;
    try { token = JSON.parse(e.data).token; } catch { token = null; }
    $('#me').textContent = name; $('#st').textContent = '● অনলাইন';
    if (!$('#call').classList.contains('on')) show('home');
  });
  es.addEventListener('users', e => { onlineUsers = JSON.parse(e.data); renderUsers(); checkPeerPresent(); });
  es.addEventListener('signal', e => onSignal(JSON.parse(e.data)));
  es.onerror = () => {
    if (!ok) {
      es.close();
      if (isRetry) { $('#st').textContent = '○ পুনরায় সংযোগ হচ্ছে…'; retryTimer = setTimeout(() => connect(name, true), 1500); }
      else $('#err').textContent = 'নামটি আগে থেকেই ব্যবহৃত, অথবা সার্ভারে সংযোগ হয়নি।';
    } else {
      $('#st').textContent = '○ পুনরায় সংযোগ হচ্ছে…';
      es.close();
      retryTimer = setTimeout(() => connect(name, true), 1200);
    }
  };
}

function checkPeerPresent(){
  if (incoming && !onlineUsers.includes(incoming.from)) cleanup('মিসড কল');
  else if (peer && pc && !['connected', 'completed'].includes(pc.connectionState) && !onlineUsers.includes(peer)) cleanup('ইউজার অফলাইন হয়ে গেছে');
}

function renderUsers(){
  const others = onlineUsers.filter(u => u !== me);
  const box = $('#users');
  if (!others.length) {
    box.innerHTML = '<div class="empty">এখন আর কেউ অনলাইনে নেই।<br>অন্য ফোন বা ডিভাইসে এই অ্যাপ খুলে আরেকটি নাম দিয়ে ঢুকুন।</div>';
    return;
  }
  box.innerHTML = '';
  others.forEach(u => {
    const d = document.createElement('div');
    d.className = 'user';
    d.innerHTML = `<div class="av"></div><div class="nm"></div><button class="ib" title="ভয়েস কল">📞</button><button class="ib" title="ভিডিও কল">🎥</button>`;
    d.querySelector('.av').textContent = initial(u);
    d.querySelector('.nm').innerHTML = '<span></span><small>অনলাইন</small>';
    d.querySelector('.nm span').textContent = u;
    const [b1, b2] = d.querySelectorAll('.ib');
    b1.onclick = () => startCall(u, false);
    b2.onclick = () => startCall(u, true);
    box.appendChild(d);
  });
}

// সিরিয়াল সিগন্যাল কিউ: offer-এর আগে ice যাওয়া বা রিকোয়েস্ট জ্যাম হওয়া ঠেকায়
function sig(to, type, data){
  const task = async () => {
    for (let i = 0; i < 3; i++) {
      try {
        const res = await fetch('/signal', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ from: me, token, to, type, data })
        });
        if (res.ok) return res;
      } catch {}
      await new Promise(r => setTimeout(r, 150 * (i + 1)));
    }
    return null;
  };
  const next = sigQueue.then(task, task);
  sigQueue = next.catch(() => null);
  return next;
}

// একাধিক ICE candidate একসাথে ব্যাচ করে পাঠায়, যাতে নেটওয়ার্ক ওভারহেড কমে এবং দ্রুত পৌঁছায়
function queueIce(to, cand){
  if (!cand) return;
  outIce.push(cand);
  if (!offerReady) return;
  clearTimeout(iceFlushTimer);
  iceFlushTimer = setTimeout(flushOutIce, 25);
}

function flushOutIce(){
  clearTimeout(iceFlushTimer);
  iceFlushTimer = null;
  if (!offerReady || !outIce.length || !peer) return;
  const batch = outIce.splice(0, outIce.length);
  sig(peer, 'ice', batch.length === 1 ? batch[0] : batch);
}

function ensureConnected(){
  if (wantOnline && me && (!es || es.readyState === 2)) connect(me, true);
}
window.addEventListener('online', ensureConnected);
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) { ensureConnected(); if (pc) keepAwake(); }
});

async function keepAwake(){
  try {
    if ('wakeLock' in navigator && !wakeLock) {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    }
  } catch {}
}
function releaseAwake(){ try { if (wakeLock) wakeLock.release(); } catch {} wakeLock = null; }

/* ---------- রিংটোন ---------- */
let actx = null, ringT = null;
function initAudio(){ try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); actx.resume(); } catch {} }
function beep(freq, dur){
  if (!actx) return;
  const o = actx.createOscillator(), g = actx.createGain();
  o.frequency.value = freq; g.gain.value = 0.12;
  o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime + dur);
}
function ring(kind){
  stopRing();
  const play = () => {
    if (kind === 'in') {
      beep(880, .25);
      setTimeout(() => beep(660, .25), 300);
      if (navigator.vibrate) navigator.vibrate([300, 150, 300]);
    } else beep(440, .5);
  };
  play();
  ringT = setInterval(play, kind === 'in' ? 1600 : 2400);
}
function stopRing(){ clearInterval(ringT); ringT = null; if (navigator.vibrate) navigator.vibrate(0); }

/* ---------- মিডিয়া ও কল শুরু (কলার) ---------- */
function getMedia(video){
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return Promise.reject(new Error('insecure'));
  return navigator.mediaDevices.getUserMedia({
    audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
    video: video ? { facingMode: facing, width: { ideal: 640 }, height: { ideal: 480 }, frameRate: { ideal: 24, max: 30 } } : false
  });
}

function mediaError(e, video){
  if (e && e.message === 'insecure') return 'মাইক/ক্যামেরা চালাতে পেজটি HTTPS (বা localhost) এ খুলতে হবে।';
  return 'মাইক্রোফোন' + (video ? '/ক্যামেরা' : '') + ' ব্যবহারের অনুমতি দিন।';
}

function attachMedia(stream, myPc){
  if (!myPc || pc !== myPc || myPc.signalingState === 'closed') {
    stream.getTracks().forEach(t => t.stop());
    return;
  }
  localStream = stream;
  for (const t of stream.getTracks()) {
    const tr = myPc.getTransceivers().find(x => x.receiver.track && x.receiver.track.kind === t.kind);
    if (tr) {
      tr.direction = 'sendrecv';
      tr.sender.replaceTrack(t).catch(() => {});
    } else {
      myPc.addTrack(t, stream);
    }
  }
  $('#local').srcObject = stream;
}

function mediaFailed(e, myPc, video){
  if (!myPc || pc !== myPc) return;
  if (peer) sig(peer, 'hangup');
  cleanup('');
  alert(mediaError(e, video));
}

async function startCall(to, video){
  if (pc || incoming) return;
  initAudio();
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    alert(mediaError(new Error('insecure'), video));
    return;
  }
  peer = to; withVideo = video; localStream = null; offerReady = false; outIce = [];
  openCallUI('রিং হচ্ছে…');
  ring('out');
  setupPC();
  const myPc = pc;

  myPc.addTransceiver('audio', { direction: 'sendrecv' });
  if (video) myPc.addTransceiver('video', { direction: 'sendrecv' });
  dc = myPc.createDataChannel('chat', { ordered: true });
  setupDC();

  mediaPromise = getMedia(video)
    .then(s => { attachMedia(s, myPc); return s; })
    .catch(e => { mediaFailed(e, myPc, video); return null; });

  try {
    const offer = await myPc.createOffer({ offerToReceiveAudio: true, offerToReceiveVideo: video });
    if (pc !== myPc) return;
    await myPc.setLocalDescription(offer);
    const r = await sig(to, 'offer', { sdp: myPc.localDescription, video });
    if (!r || !r.ok) throw new Error('offline');
    if (pc !== myPc) return;
    offerReady = true;
    flushOutIce();
  } catch {
    if (pc === myPc) return cleanup('ইউজার এখন অনলাইনে নেই');
  }

  ringTimeout = setTimeout(() => {
    if (pc === myPc && !['connected', 'completed'].includes(myPc.connectionState)) {
      sig(peer, 'hangup');
      cleanup('কেউ ধরেনি');
    }
  }, 45000);
}

function setupPC(){
  pc = new RTCPeerConnection(ICE);
  const myPc = pc;
  remoteStream = new MediaStream();
  $('#remote').srcObject = remoteStream;

  pc.onicecandidate = e => {
    if (pc !== myPc) return;
    if (e.candidate) queueIce(peer, e.candidate);
    else flushOutIce();
  };

  pc.ontrack = e => {
    if (pc !== myPc) return;
    remoteStream.addTrack(e.track);
    $('#remote').play().catch(() => {});
  };

  pc.ondatachannel = e => {
    if (pc !== myPc) return;
    dc = e.channel;
    setupDC();
  };

  pc.onconnectionstatechange = () => {
    if (pc !== myPc) return;
    const s = myPc.connectionState;
    clearTimeout(discTimer);
    if (s === 'connected' || s === 'completed') {
      clearTimeout(ringTimeout);
      clearTimeout(iceRestartTimer);
      stopRing();
      startTimer();
      keepAwake();
      $('#remote').play().catch(() => {});
      if (withVideo) $('#info').style.display = 'none';
    } else if (s === 'disconnected') {
      $('#cstat').textContent = 'সংযোগ পুনঃস্থাপন হচ্ছে…';
      if (typeof myPc.restartIce === 'function') {
        try { myPc.restartIce(); } catch {}
      }
      discTimer = setTimeout(() => {
        if (pc === myPc && pc.connectionState === 'disconnected') cleanup('সংযোগ বিচ্ছিন্ন হয়েছে');
      }, 8000);
    } else if (s === 'failed') {
      cleanup('সংযোগ বিচ্ছিন্ন হয়েছে');
    }
  };
}

function setupDC(){
  if (!dc) return;
  dc.onmessage = e => {
    try {
      const msg = JSON.parse(e.data);
      if (msg && msg.type === 'chat') appendMsg(msg.text, false);
    } catch {
      appendMsg(String(e.data), false);
    }
  };
}

function openCallUI(status){
  $('#cav').textContent = initial(peer);
  $('#cname').textContent = peer;
  $('#cstat').textContent = status;
  $('#info').style.display = '';
  $('#msgs').innerHTML = '';
  $('#chat').classList.remove('on');
  const lv = $('#local');
  lv.style.display = withVideo ? '' : 'none';
  lv.srcObject = localStream;
  $('#remote').style.visibility = withVideo ? 'visible' : 'hidden';
  $('#bCam').style.display = withVideo ? '' : 'none';
  $('#bFlip').style.display = withVideo ? '' : 'none';
  $('#local').style.transform = facing === 'user' ? 'scaleX(-1)' : 'none';
  $('#bMute').classList.remove('off'); $('#bMute').textContent = '🎤';
  $('#bCam').classList.remove('off'); $('#bCam').textContent = '📷';
  show('call');
}

function startTimer(){
  startedAt = Date.now(); clearInterval(timer);
  timer = setInterval(() => {
    const s = Math.floor((Date.now() - startedAt) / 1000);
    $('#cstat').textContent = String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
  }, 1000);
}

/* ---------- সিগন্যাল গ্রহণ ---------- */
async function onSignal({ from, type, data }){
  if (type === 'offer') {
    if (pc || incoming) return sig(from, 'busy');
    const video = !!data.video;
    peer = from; withVideo = video; localStream = null; pendingIce = []; outIce = []; offerReady = false;
    setupPC();
    const myPc = pc;
    // রিং বাজা অবস্থাতেই offer সেট করে রাখা হয়, যাতে ধরার সাথে সাথে answer তৈরি করা যায়
    const ready = myPc.setRemoteDescription(data.sdp).then(() => flushIce(myPc)).catch(() => {});
    incoming = { from, data, ready, myPc };

    // রিসিভারের প্রান্তেও আগে থেকে মিডিয়া অনুমতি নেওয়ার চেষ্টা (ইনকামিং রিংয়ের সময়)
    mediaPromise = getMedia(video)
      .then(s => { attachMedia(s, myPc); return s; })
      .catch(() => null);

    $('#iav').textContent = initial(from);
    $('#iname').textContent = from;
    $('#itype').textContent = video ? 'ভিডিও কল আসছে…' : 'ভয়েস কল আসছে…';
    $('#incoming').classList.add('on');
    ring('in');
  } else if (type === 'answer') {
    if (pc && from === peer) {
      try {
